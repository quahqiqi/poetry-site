<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>字里｜维护中</title>
<style>
:root{
 --bg:#fdfbf7;--text:#2c2621;--muted:#85786e;--line:#e8dfd3;
}
*{box-sizing:border-box}
body{
 margin:0;
 font-family:"Noto Serif SC","Source Han Serif SC","Songti SC",serif;
 background:var(--bg);
 color:var(--text);
 display:flex;
 justify-content:center;
 align-items:center;
 min-height:100vh;
}
main{
 width:min(720px,92vw);
 padding:4rem 2rem;
}
h1{
 margin:0 0 3rem;
 text-align:center;
 font-size:3rem;
 font-weight:600;
 letter-spacing:.22em;
}
.intro{
 text-align:center;
 line-height:2.1;
 color:var(--muted);
 margin-bottom:5rem;
}
.section{
 max-width:340px;
 margin:0 auto;
}
.section h2{
 font-size:1rem;
 font-weight:600;
 margin:0 0 1rem;
 letter-spacing:.12em;
}
.item{
 padding:.55rem 0;
 border-bottom:1px solid var(--line);
 color:var(--muted);
}
.footer{
 text-align:center;
 margin-top:5rem;
 color:var(--muted);
}
</style>
</head>
<body>
<main>
<h1>字里</h1>

<div class="intro">
<div>今天暂停营业 ☕</div>
<div>网站正在维护中。</div>
<br>
<div>如果一切顺利，</div>
<div>应该很快就会回来。</div>
</div>

<div class="section">
<h2>正在进行</h2>
<div class="item">修复 Bug</div>
<div class="item">页面优化</div>
<div class="item">偷偷加了一首新诗（如果有的话）</div>
</div>

<div class="footer">
感谢你的耐心等待。
</div>
</main>
</body>
</html>
